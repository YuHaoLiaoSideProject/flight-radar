name: Deploy Flight Radar

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_crawler:
        description: 'Skip crawler (only deploy)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_crawler != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_crawler != 'true' }}
        run: |
          pip install requests beautifulsoup4

      - name: Run crawler
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_crawler != 'true' }}
        run: |
          python scripts/fetch_flights.py
          python scripts/fetch_raw_data.py
          python scripts/build_api.py

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy CNAME for custom domain
        run: cp CNAME dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: main
